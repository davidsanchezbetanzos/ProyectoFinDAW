<div style="padding: 2rem;">
  <h2>👥 Gestión de Participantes</h2>

  @if (usuarios.length > 0) {
    <table border="1" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        @for (u of usuarios; track u.id) {
          <tr>
            <td>{{ u.nombre }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.rol }}</td>
            <td>
              <span [style.color]="u.pagado ? 'green' : 'red'">
                {{ u.pagado ? '✅ Pagado' : '❌ Pendiente' }}
              </span>
            </td>
            <td>
              <button (click)="cambiarEstadoPago(u)">
                {{ u.pagado ? 'Revertir' : 'Validar Pago' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p>Cargando usuarios o lista vacía...</p>
  }
</div>
